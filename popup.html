<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EP•非功快申</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>
        <img src="icons/icon128.png" alt="Logo" class="header-logo">
        EP • 非功快申
      </h1>
    </div>

    <div class="tabs">
      <button class="tab-button active" data-tab="pending">
        <svg class="tab-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        任务
      </button>
      <button class="tab-button" data-tab="preset">
        <svg class="tab-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        配置
      </button>
    </div>

    <div class="tab-content">
      <!-- 待填写标签页 -->
      <div id="pending-tab" class="tab-pane active">
        <div class="logs-container">
          <div class="project-tabs">
            <div class="filter-bar" id="pending-filter-bar">
              <div class="filter-controls">
                <select id="pending-status-filter" class="filter-select">
                  <option value="pending" selected>未申请</option>
                  <option value="filled">已申请</option>
                  <option value="all">全部</option>
                </select>
                <select id="pending-project-filter" class="filter-select">
                  <option value="all">全部项目</option>
                </select>
                <input type="date" id="pending-date-filter" class="filter-date" placeholder="选择日期">
              </div>
              <div class="filter-actions">
                <button id="add-new-log-btn" class="btn-primary btn-add-log" title="新增日志">
                  新增
                </button>
              </div>
            </div>
          </div>
          <div id="pending-logs-list" class="logs-list">
            <!-- 日志列表将通过JavaScript动态生成 -->
          </div>
        </div>
      </div>

      

      <!-- 配置标签页 -->
      <div id="preset-tab" class="tab-pane">
        <div class="config-container">
          <!-- 自动填充卡片 -->
          <div class="config-card">
            <h3>自动填充</h3>
            <div class="form-group">
              <label class="checkbox-label">
                <div class="apple-switch">
                  <input type="checkbox" id="auto-fill-presets-checkbox" checked>
                  <span class="slider"></span>
                </div>
                打开插件时自动填充预设配置，与底部填充按钮功能相同
              </label>
            </div>
          </div>
          <!-- 预设项目卡片 -->
          <div class="config-card">
            <h3>预设项目</h3>
            <div class="preset-projects-list" id="preset-projects-tab-list">
              <!-- 预设项目列表将通过JavaScript动态生成 -->
            </div>
            <div class="add-preset-project">
              <input type="text" id="new-preset-project-tab" placeholder="输入新项目名称">
              <button id="add-preset-project-tab-btn" class="btn-small">添加</button>
            </div>
          </div>

          <!-- 需求标签卡片 -->
          <div class="config-card">
            <h3>需求标签</h3>
            <div class="form-group">
              <select id="demand-tag-select">
                <option value="">请选择标签</option>
                <option value="会议沟通">会议沟通</option>
                <option value="出差在途">出差在途</option>
                <option value="文档编写">文档编写</option>
                <option value="部署调试">部署调试</option>
                <option value="接口类调试">接口类调试</option>
                <option value="评审">评审</option>
                <option value="培训推广">培训推广</option>
                <option value="配合杂事">配合杂事</option>
                <option value="日常巡查配合工作">日常巡查配合工作</option>
                <option value="产品发版运维">产品发版运维</option>
                <option value="售前支撑">售前支撑</option>
                <option value="计划管控">计划管控</option>
              </select>
            </div>
          </div>

          <!-- 工作类型卡片 -->
          <div class="config-card">
            <h3>工作类型</h3>
            <div class="form-group">
              <select id="work-type-select">
                <option value="">请选择类型</option>
                <option value="建设工作">建设工作</option>
                <option value="维护工作">维护工作</option>
                <option value="合同外工作">合同外工作</option>
                <option value="建设工作遗留">建设工作遗留</option>
              </select>
            </div>
          </div>

          <!-- 关闭提醒卡片 -->
          <div class="config-card">
            <h3>关闭提醒</h3>
            <div class="form-group">
              <label class="checkbox-label">
                <div class="apple-switch">
                  <input type="checkbox" id="close-reminders-checkbox">
                  <span class="slider"></span>
                </div>
                自动隐藏页面帮助信息区域
              </label>
            </div>
          </div>

          <!-- 蓝图预设卡片 -->
          <div class="config-card">
            <h3>蓝图预设</h3>
            <div class="form-group">
              <button id="capture-blueprint-btn" class="btn-capture">捕获</button>
              <button id="apply-blueprint-btn" class="btn-apply">应用</button>
            </div>
            <div class="form-group">
              <div id="blueprint-presets-list"></div>
            </div>
          </div>

          <!-- 工作场景预设卡片 -->
          <div class="config-card">
            <h3>工作场景预设</h3>
            <div class="form-group">
              <button id="capture-stagedemand-btn" class="btn-capture">捕获</button>
              <button id="apply-stagedemand-btn" class="btn-apply">应用</button>
            </div>
            <div class="form-group">
              <div id="stagedemand-presets-list"></div>
            </div>
          </div>

          <!-- 任务审核人预设卡片 -->
          <div class="config-card">
            <h3>任务审核人预设</h3>
            <div class="form-group">
              <button id="capture-taskreviewer-btn" class="btn-capture">捕获</button>
              <button id="apply-taskreviewer-btn" class="btn-apply">应用</button>
            </div>
            <div class="form-group">
              <div id="taskreviewer-presets-list"></div>
            </div>
          </div>

          <!-- 问题反馈卡片 -->
          <div class="config-card">
            <h3>问题反馈</h3>
            <button id="feedback-btn" class="btn-secondary">问题反馈</button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- 申请非公按钮 -->
  <div class="apply-non-public-container">
    <button id="apply-presets-btn" class="btn-apply-non-public compact hidden" title="填充">
      <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    </button>
    <button id="write-log-btn" class="btn-apply-non-public compact" title="写日志">
      <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </button>
    <button id="apply-non-public-btn" class="btn-apply-non-public compact" title="申请非功能任务">
      <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-8 14H7v-2h4v2zm0-4H7v-2h4v2zm0-4H7V7h4v2zm6 8h-4v-2h4v2zm0-4h-4v-2h4v2zm0-4h-4V7h4v2z"/></svg>
    </button>
    <button id="distribute-non-public-btn" class="btn-apply-non-public compact" title="发放非功能任务">
      <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-8 8z"/></svg>
    </button>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <div class="status-indicator">
      <div class="status-hours">
        <span class="hours-label">待填工时：</span>
        <span class="hours-value">0</span>
      </div>
      <div class="status-filled-hours" style="display: none;">
        <span class="filled-hours-label">已填工时：</span>
        <span class="filled-hours-value">0</span>
      </div>
    </div>
  
  <!-- 新增日志模态框 -->
  <div id="add-log-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>新增工作日志</h3>
        <button type="button" class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <form id="modal-add-log-form">
        <div class="modal-body">
          <div class="form-group">
            <label for="modal-project">项目名称</label>
            <select id="modal-project" class="form-control" required>
              <option value="">请选择项目</option>
            </select>
          </div>
          <div class="form-group">
            <label for="modal-task-name">任务名称</label>
            <input type="text" id="modal-task-name" class="form-control" placeholder="请输入任务名称" required>
          </div>
          <div class="form-group">
            <label for="modal-content">工作内容</label>
            <textarea id="modal-content" class="form-control" placeholder="请输入工作内容" rows="3" required></textarea>
          </div>
          <div class="form-row">
            <div class="form-group col-half">
              <label for="modal-hours">工作时长</label>
              <input type="number" id="modal-hours" class="form-control" placeholder="请输入工作时长" step="0.5" min="0.5" max="24" required>
            </div>
            <div class="form-group col-half">
              <label for="modal-date">工作日期</label>
              <input type="date" id="modal-date" class="form-control" required>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="modal-cancel-btn">取消</button>
          <button type="button" class="btn btn-secondary" id="modal-save-continue-btn">保存并继续</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>

</html>
