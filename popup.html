<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EP•非功快申</title>
  <link rel="stylesheet" href="styles.css">
</head>

  <body>
    <div class="container">
      <div class="header">
        <button id="open-sidepanel-btn" class="header-pin-btn" title="侧边栏固定" aria-label="侧边栏固定">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="8" y1="4" x2="8" y2="20" stroke="currentColor" stroke-width="2"/>
            <path d="M11 8h8M11 12h8M11 16h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <h1>
          <img src="icons/icon128.png" alt="Logo" class="header-logo">
          EP • 非功快申
        </h1>
        <button id="header-config-btn" class="header-config-btn" title="配置" aria-label="配置">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </div>
    

    <div class="tab-content">
      <!-- 待填写标签页 -->
      <div id="pending-tab" class="tab-pane active">
        <div class="project-tabs">
          <div class="filter-bar" id="pending-filter-bar">
            <div class="filter-controls">
              <select id="pending-status-filter" class="filter-select">
                <option value="pending" selected>未申请</option>
                  <option value="filled">已申请</option>
                  <option value="all">全部</option>
                </select>
                <select id="pending-project-filter" class="filter-select">
                  <option value="all">全部项目</option>
                </select>
                <input type="date" id="pending-date-filter" class="filter-date" placeholder="选择日期">
              </div>
              <div class="filter-actions">
                <button id="add-new-log-btn" class="btn-add-log" title="新增日志" aria-label="新增日志">
                  <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
              </div>
            </div>
          </div>
          <div id="pending-logs-list" class="logs-list">
            <!-- 日志列表将通过JavaScript动态生成 -->
          </div>
      </div>

      

      <!-- 配置标签页 -->
      <div id="preset-tab" class="tab-pane">
          <!-- 自动填充卡片 -->
          <div class="config-card">
            <h3>自动填充</h3>
            <div class="form-group">
              <label class="checkbox-label">
                <div class="apple-switch">
                  <input type="checkbox" id="auto-fill-presets-checkbox" checked>
                  <span class="slider"></span>
                </div>
                打开插件时自动填充预设配置
              </label>
            </div>
          </div>
          <!-- 数据展示配置卡片 -->
          <div class="config-card">
            <h3>数据展示</h3>
            <div class="form-group">
              <label class="checkbox-label">
                <div class="apple-switch">
                  <input type="checkbox" id="group-by-project-checkbox">
                  <span class="slider"></span>
                </div>
                数据按项目分类展示
              </label>
            </div>
          </div>
          <!-- 需求标签卡片 -->
          <div class="config-card">
            <h3>需求标签预设</h3>
            <div class="form-group">
              <select id="demand-tag-select">
                <option value="">请选择标签</option>
                <option value="会议沟通">会议沟通</option>
                <option value="出差在途">出差在途</option>
                <option value="文档编写">文档编写</option>
                <option value="部署调试">部署调试</option>
                <option value="接口类调试">接口类调试</option>
                <option value="评审">评审</option>
                <option value="培训推广">培训推广</option>
                <option value="配合杂事">配合杂事</option>
                <option value="日常巡查配合工作">日常巡查配合工作</option>
                <option value="产品发版运维">产品发版运维</option>
                <option value="售前支撑">售前支撑</option>
                <option value="计划管控">计划管控</option>
              </select>
            </div>
          </div>

          <!-- 工作类型卡片 -->
          <div class="config-card">
            <h3>工作类型预设</h3>
            <div class="form-group">
              <select id="work-type-select">
                <option value="">请选择类型</option>
                <option value="建设工作">建设工作</option>
                <option value="维护工作">维护工作</option>
                <option value="合同外工作">合同外工作</option>
                <option value="建设工作遗留">建设工作遗留</option>
              </select>
            </div>
          </div>

          <!-- 关闭提醒卡片 -->
          <div class="config-card">
            <h3>关闭提醒</h3>
            <div class="form-group">
              <label class="checkbox-label">
                <div class="apple-switch">
                  <input type="checkbox" id="close-reminders-checkbox">
                  <span class="slider"></span>
                </div>
                自动隐藏页面帮助信息区域
              </label>
            </div>
          </div>


          

          <!-- 一键捕获与汇总 -->
          <div class="config-card">
            <h3>一键捕获与汇总</h3>
            <div class="form-group explain-row">
              <p class="explain-text">先打开OA任务申请页面，填写数据后，一键捕获，用于下次自动填充</p>
            </div>
            <div class="form-group">
              <button id="capture-all-btn" class="btn-capture">一键捕获</button>
            </div>
            <div class="form-group">
              <div id="unified-presets-list"></div>
            </div>
          </div>

          <div id="unified-details-modal" class="modal">
            <div class="modal-content">
              <div class="modal-header">
                <h3>项目详情</h3>
                <button type="button" class="modal-close" id="unified-details-close-btn">&times;</button>
              </div>
              <div class="modal-body">
                <div id="unified-details-body"></div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="unified-details-cancel-btn">关闭</button>
              </div>
            </div>
          </div>

          <!-- 数据导入导出卡片 -->
          <div class="config-card">
            <h3>任务数据管理</h3>
            <div class="form-group export-filters-row">
              <select id="export-project-filter" class="filter-select">
                <option value="all">全部项目</option>
              </select>
              <select id="export-status-filter" class="filter-select">
                <option value="all">全部</option>
                <option value="pending">未申请</option>
                <option value="filled">已申请</option>
              </select>
            </div>
            <div class="form-group export-filters-row">
              <input type="date" id="export-date-start" class="filter-date" placeholder="开始日期">
              <span class="export-date-dash">—</span>
              <input type="date" id="export-date-end" class="filter-date" placeholder="结束日期">
            </div>
            <div class="form-group">
              <button id="export-logs-btn" class="btn-secondary">导出任务数据</button>
              <button id="import-logs-btn" class="btn-secondary">导入任务数据</button>
              <button id="clear-all-data-btn" class="btn-secondary" style="background-color: #dc3545; color: white;">清除数据</button>
              <input type="file" id="import-logs-file-input" accept="application/json" style="display:none">
            </div>
          </div>

          <div class="config-card">
            <h3>插件数据管理</h3>
            <div class="form-group explain-row">
              <p class="explain-text">导入导出插件设置与捕获的数据（蓝图、工作场景、审核人等）</p>
            </div>
            <div class="form-group">
              <button id="export-plugin-btn" class="btn-secondary">导出插件数据</button>
              <button id="import-plugin-btn" class="btn-secondary">导入插件数据</button>
              <button id="clear-plugin-data-btn" class="btn-secondary" style="background-color: #dc3545; color: white;">清除数据</button>
              <input type="file" id="import-plugin-file-input" accept="application/json" style="display:none">
            </div>
          </div>

          <!-- 问题反馈卡片 -->
          <div class="config-card">
            <h3>问题反馈</h3>
            <button id="feedback-btn" class="btn-secondary">问题提交</button>
            <button id="issue-list-btn" class="btn-secondary">问题列表</button>
          </div>

          <!-- 版本检测卡片 -->
          <div class="config-card">
            <h3>版本检测</h3>
            <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
              <p style="margin: 0;">当前版本：<span id="current-version"></span></p>
              <button id="check-update-btn" class="btn btn-primary">检测更新</button>
            </div>
            <div class="form-group">
                <p id="update-info" style="display: none; margin-top: 8px;">有新版本可用！最新版本：<span id="latest-version"></span> <a href="#" id="download-link" target="_blank">点击下载</a></p>
                <p id="no-update-info" style="display: none; margin-top: 8px; color: #28a745;">当前已是最新版本！</p>
            </div>
          </div>

      </div>
    </div>
  </div>

  <button id="close-config-btn" class="close-config-btn" title="关闭" aria-label="关闭">×</button>

  <!-- 申请非公按钮 -->
  <div class="apply-non-public-container">
    <button id="write-log-btn" class="btn-apply-non-public text-btn" title="填写日志">
      填写日志
    </button>
    <button id="apply-non-public-btn" class="btn-apply-non-public text-btn" title="申请非功能任务">
      申请任务
    </button>
    <button id="distribute-non-public-btn" class="btn-apply-non-public text-btn" title="发放非功能任务">
      发放任务
    </button>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <div class="status-indicator">
      <div class="status-hours">
        <span class="hours-label">工时：</span>
        <span class="hours-value">0</span>
      </div>
      <div class="status-filled-hours" style="display: none;">
        <span class="filled-hours-label">工时：</span>
        <span class="filled-hours-value">0</span>
      </div>
    </div>
  
  <!-- 新增日志模态框 -->
  <div id="add-log-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>新增工作日志</h3>
        <button type="button" class="modal-close" id="modal-close-btn">&times;</button>
      </div>
      <form id="modal-add-log-form">
        <div class="modal-body">
          <div class="form-group">
            <label for="modal-project">项目名称</label>
            <input type="text" id="modal-project" class="form-control" list="modal-project-list" placeholder="请选择或输入项目名称" required>
            <datalist id="modal-project-list"></datalist>
          </div>
          <div class="form-group">
            <label for="modal-task-name">任务名称</label>
            <input type="text" id="modal-task-name" class="form-control" placeholder="请输入任务名称" required>
          </div>
          <div class="form-row">
            <div class="form-group col-half">
              <label for="modal-hours">工作时长</label>
              <div class="input-with-action">
                <input type="number" id="modal-hours" class="form-control" placeholder="请输入工作时长" step="0.5" min="0.5" max="24" required>
                <button type="button" class="input-clear-btn" id="clear-hours-btn">清空</button>
              </div>
            </div>
            <div class="form-group col-half">
              <label for="modal-date">工作日期</label>
              <input type="date" id="modal-date" class="form-control" required>
            </div>
          </div>
          <div class="form-group">
            <div class="label-inline">
              <label for="modal-content">工作内容</label>
              <div class="auto-copy-toggle">
                <span id="auto-copy-switch-label">自动复制任务名称</span>
                <label class="apple-switch" title="开启后保存时自动将任务名称复制到工作内容">
                  <input type="checkbox" id="auto-copy-task-to-content-switch" checked>
                  <span class="slider"></span>
                </label>
              </div>
            </div>
            <textarea id="modal-content" class="form-control" placeholder="可不填写，保存时将使用任务名称" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="modal-cancel-btn">取消</button>
          <button type="button" class="btn btn-secondary" id="modal-save-continue-btn">保存并继续</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>

</html>
