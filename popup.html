<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epoint•非功快申</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>
        <img src="icons/icon128.png" alt="Logo" class="header-logo">
        Epoint • 非功快申
      </h1>
    </div>

    <div class="tabs">
      <button class="tab-button active" data-tab="add">
        <svg class="tab-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        增加日志
      </button>
      <button class="tab-button" data-tab="pending">
        <svg class="tab-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
        待申请
      </button>
      <button class="tab-button" data-tab="filled">
        <svg class="tab-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        已申请
      </button>
      <button class="tab-button" data-tab="preset">
        <svg class="tab-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        配置
      </button>
    </div>

    <div class="tab-content">
      <!-- 增加日志标签页 -->
      <div id="add-tab" class="tab-pane">
        <div class="compact-form">
          <form id="log-form">
            <div class="form-group">
              <label for="project">项目名称</label>
              <div class="project-input-container">
                <select id="project-select" class="project-select"></select>
                <input type="text" id="project" class="hidden" placeholder="请输入项目名称">
                <button type="button" id="preset-projects-btn" class="btn-small preset-btn">预设</button>
              </div>
            </div>
            <div class="form-group">
              <label for="task-name">任务名称</label>
              <input type="text" id="task-name" placeholder="请输入任务名称">
            </div>
            <div class="form-group">
              <label for="content">工作内容</label>
              <textarea id="content" rows="3" placeholder="请输入工作内容"></textarea>
            </div>
            <div class="form-row">
              <div class="form-group half-width">
                <label for="hours">工时（小时）</label>
                <input type="number" id="hours" min="0.5" step="0.5" value="1">
              </div>
              <div class="form-group half-width">
                <label for="date">日期</label>
                <input type="date" id="date">
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn-primary">
                <svg class="btn-icon" viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                保存日志
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- 待填写标签页 -->
      <div id="pending-tab" class="tab-pane active">
        <div class="logs-container">
          <div class="project-tabs">
            <div class="filter-bar" id="pending-filter-bar">
              <div class="filter-controls">
                <select id="pending-project-filter" class="filter-select">
                  <option value="all">全部项目</option>
                </select>
                <input type="date" id="pending-date-filter" class="filter-date" placeholder="选择日期">
              </div>
              <div class="filter-actions">
                <button type="button" id="pending-select-mode-btn" class="btn-small">选择</button>
                <button type="button" id="pending-select-all-btn" class="btn-small hidden">全选</button>
                <button type="button" id="pending-delete-selected-btn" class="btn-small hidden">删除</button>
              </div>
            </div>
          </div>
          <div id="pending-logs-list" class="logs-list">
            <!-- 日志列表将通过JavaScript动态生成 -->
          </div>
        </div>
      </div>

      <!-- 已填写标签页 -->
      <div id="filled-tab" class="tab-pane">
        <div class="logs-container">
          <div class="project-tabs" id="filled-project-tabs">
            <div class="filter-bar" id="filled-filter-bar">
              <div class="filter-controls">
                <select id="filled-project-filter" class="filter-select">
                  <option value="all">全部项目</option>
                </select>
                <input type="date" id="filled-date-filter" class="filter-date" placeholder="选择日期">
              </div>
              <div class="filter-actions">
                <button type="button" id="filled-select-mode-btn" class="btn-small">选择</button>
                <button type="button" id="filled-select-all-btn" class="btn-small hidden">全选</button>
                <button type="button" id="filled-delete-selected-btn" class="btn-small hidden">删除</button>
              </div>
            </div>
          </div>
          <div id="filled-logs-list" class="logs-list">
            <!-- 已填写日志列表将通过JavaScript动态生成 -->
          </div>
        </div>
      </div>

      <!-- 配置标签页 -->
      <div id="preset-tab" class="tab-pane">
        <div class="config-container">
          <!-- 预设项目卡片 -->
          <div class="config-card">
            <h3>预设项目</h3>
            <div class="preset-projects-list" id="preset-projects-tab-list">
              <!-- 预设项目列表将通过JavaScript动态生成 -->
            </div>
            <div class="add-preset-project">
              <input type="text" id="new-preset-project-tab" placeholder="输入新项目名称">
              <button id="add-preset-project-tab-btn" class="btn-small">添加</button>
            </div>
          </div>

          <!-- 需求标签卡片 -->
          <div class="config-card">
            <h3>需求标签</h3>
            <div class="form-group">
              <select id="demand-tag-select">
                <option value="">请选择标签</option>
                <option value="会议沟通">会议沟通</option>
                <option value="出差在途">出差在途</option>
                <option value="文档编写">文档编写</option>
                <option value="部署调试">部署调试</option>
                <option value="接口类调试">接口类调试</option>
                <option value="评审">评审</option>
                <option value="培训推广">培训推广</option>
                <option value="配合杂事">配合杂事</option>
                <option value="日常巡查配合工作">日常巡查配合工作</option>
                <option value="产品发版运维">产品发版运维</option>
                <option value="售前支撑">售前支撑</option>
                <option value="计划管控">计划管控</option>
              </select>
            </div>
          </div>

          <!-- 工作类型卡片 -->
          <div class="config-card">
            <h3>工作类型</h3>
            <div class="form-group">
              <select id="work-type-select">
                <option value="">请选择类型</option>
                <option value="建设工作">建设工作</option>
                <option value="维护工作">维护工作</option>
                <option value="合同外工作">合同外工作</option>
                <option value="建设工作遗留">建设工作遗留</option>
              </select>
            </div>
          </div>

          <!-- 关闭提醒卡片 -->
          <div class="config-card">
            <h3>关闭提醒</h3>
            <div class="form-group">
              <label class="checkbox-label">
                <div class="apple-switch">
                  <input type="checkbox" id="close-reminders-checkbox">
                  <span class="slider"></span>
                </div>
                自动隐藏页面帮助信息区域
              </label>
            </div>
          </div>

          <!-- 蓝图预设卡片 -->
          <div class="config-card">
            <h3>蓝图预设</h3>
            <div class="form-group">
              <button id="capture-blueprint-btn" class="btn-capture">捕获</button>
              <button id="apply-blueprint-btn" class="btn-apply">应用</button>
            </div>
            <div class="form-group">
              <label class="checkbox-label">
                <div class="apple-switch">
                  <input type="checkbox" id="blueprint-auto-apply-checkbox" checked>
                  <span class="slider"></span>
                </div>
                插件打开时自动应用蓝图预设
              </label>
            </div>
            <div class="form-group">
              <div id="blueprint-presets-list"></div>
            </div>
          </div>

          <!-- 工作场景预设卡片 -->
          <div class="config-card">
            <h3>工作场景预设</h3>
            <div class="form-group">
              <button id="capture-stagedemand-btn" class="btn-capture">捕获</button>
              <button id="apply-stagedemand-btn" class="btn-apply">应用</button>
            </div>
            <div class="form-group">
              <label class="checkbox-label">
                <div class="apple-switch">
                  <input type="checkbox" id="stagedemand-auto-apply-checkbox" checked>
                  <span class="slider"></span>
                </div>
                插件打开时自动应用工作场景预设
              </label>
            </div>
            <div class="form-group">
              <div id="stagedemand-presets-list"></div>
            </div>
          </div>

          <!-- 任务审核人预设卡片 -->
          <div class="config-card">
            <h3>任务审核人预设</h3>
            <div class="form-group">
              <button id="capture-taskreviewer-btn" class="btn-capture">捕获</button>
              <button id="apply-taskreviewer-btn" class="btn-apply">应用</button>
            </div>
            <div class="form-group">
              <label class="checkbox-label">
                <div class="apple-switch">
                  <input type="checkbox" id="taskreviewer-auto-apply-checkbox" checked>
                  <span class="slider"></span>
                </div>
                插件打开时自动应用任务审核人预设
              </label>
            </div>
            <div class="form-group">
              <div id="taskreviewer-presets-list"></div>
            </div>
          </div>

          <!-- 问题反馈卡片 -->
          <div class="config-card">
            <h3>问题反馈</h3>
            <button id="feedback-btn" class="btn-secondary">问题反馈</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 申请非公按钮 -->
  <div class="apply-non-public-container">
    <button id="apply-non-public-btn" class="btn-apply-non-public">
      <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-8 14H7v-2h4v2zm0-4H7v-2h4v2zm0-4H7V7h4v2zm6 8h-4v-2h4v2zm0-4h-4v-2h4v2zm0-4h-4V7h4v2z"/></svg>
      申请非功
    </button>
    <button id="distribute-non-public-btn" class="btn-apply-non-public">
      <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-8 8z"/></svg>
      发放非功
    </button>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <div class="status-indicator">
      <div class="status-main">
        <span class="status-icon"></span>
        <span class="status-text"></span>
      </div>
      <div class="status-hours">
        <span class="hours-label">待填工时：</span>
        <span class="hours-value">0</span>
      </div>
      <div class="status-filled-hours" style="display: none;">
        <span class="filled-hours-label">已填工时：</span>
        <span class="filled-hours-value">0</span>
      </div>
    </div>
  <script src="popup.js"></script>
</body>

</html>
