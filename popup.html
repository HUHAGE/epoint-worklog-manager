<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epoint非公快申</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>Epoint非公快申</h1>
    </div>

    <div class="tabs">
      <button class="tab-button active" data-tab="add">增加日志</button>
      <button class="tab-button" data-tab="pending">待填写</button>
      <button class="tab-button" data-tab="filled">已填写</button>
      <button class="tab-button" data-tab="preset">配置</button>
    </div>

    <div class="tab-content">
      <!-- 增加日志标签页 -->
      <div id="add-tab" class="tab-pane">
        <div class="compact-form">
          <form id="log-form">
            <div class="form-group">
              <label for="project">项目名称</label>
              <div class="project-input-container">
                <select id="project-select" class="project-select"></select>
                <input type="text" id="project" class="hidden" placeholder="请输入项目名称">
                <button type="button" id="preset-projects-btn" class="btn-small preset-btn">预设</button>
              </div>
            </div>
            <div class="form-group">
              <label for="task-name">任务名称</label>
              <input type="text" id="task-name" placeholder="请输入任务名称">
            </div>
            <div class="form-group">
              <label for="content">工作内容</label>
              <textarea id="content" rows="3" placeholder="请输入工作内容"></textarea>
            </div>
            <div class="form-row">
              <div class="form-group half-width">
                <label for="hours">工时</label>
                <input type="number" id="hours" min="0.5" step="0.5" value="1">
              </div>
              <div class="form-group half-width">
                <label for="date">日期</label>
                <input type="date" id="date">
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn-primary">保存</button>
            </div>
          </form>
        </div>
      </div>

      <!-- 待填写标签页 -->
      <div id="pending-tab" class="tab-pane active">
        <div class="logs-container">
          <div class="project-tabs">
            <button class="project-tab-btn active" data-project="all">全部项目</button>
          </div>
          <div id="pending-logs-list" class="logs-list">
            <!-- 日志列表将通过JavaScript动态生成 -->
          </div>
        </div>
      </div>

      <!-- 已填写标签页 -->
      <div id="filled-tab" class="tab-pane">
        <div class="logs-container">
          <div class="project-tabs" id="filled-project-tabs">
            <button class="project-tab-btn active" data-project="all">全部项目</button>
          </div>
          <div id="filled-logs-list" class="logs-list">
            <!-- 已填写日志列表将通过JavaScript动态生成 -->
          </div>
        </div>
      </div>

      <!-- 配置标签页 -->
      <div id="preset-tab" class="tab-pane">
        <div class="config-container">
          <!-- 预设项目卡片 -->
          <div class="config-card">
            <h3>预设项目</h3>
            <div class="preset-projects-list" id="preset-projects-tab-list">
              <!-- 预设项目列表将通过JavaScript动态生成 -->
            </div>
            <div class="add-preset-project">
              <input type="text" id="new-preset-project-tab" placeholder="输入新项目名称">
              <button id="add-preset-project-tab-btn" class="btn-small">添加</button>
            </div>
          </div>

          <!-- 需求标签卡片 -->
          <div class="config-card">
            <h3>需求标签</h3>
            <div class="form-group">
              <select id="demand-tag-select">
                <option value="">请选择标签</option>
                <option value="会议沟通">会议沟通</option>
                <option value="出差在途">出差在途</option>
                <option value="文档编写">文档编写</option>
                <option value="部署调试">部署调试</option>
                <option value="接口类调试">接口类调试</option>
                <option value="评审">评审</option>
                <option value="培训推广">培训推广</option>
                <option value="配合杂事">配合杂事</option>
                <option value="日常巡查配合工作">日常巡查配合工作</option>
                <option value="产品发版运维">产品发版运维</option>
                <option value="售前支撑">售前支撑</option>
                <option value="计划管控">计划管控</option>
              </select>
            </div>
          </div>

          <!-- 工作类型卡片 -->
          <div class="config-card">
            <h3>工作类型</h3>
            <div class="form-group">
              <select id="work-type-select">
                <option value="">请选择类型</option>
                <option value="建设工作">建设工作</option>
                <option value="维护工作">维护工作</option>
                <option value="合同外工作">合同外工作</option>
                <option value="建设工作遗留">建设工作遗留</option>
              </select>
            </div>
          </div>

          <!-- 关闭提醒卡片 -->
          <div class="config-card">
            <h3>关闭提醒</h3>
            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="close-reminders-checkbox">
                自动隐藏页面帮助信息区域
              </label>
            </div>
          </div>

          <!-- 蓝图预设卡片 -->
          <div class="config-card">
            <h3>蓝图预设</h3>
            <div class="form-group">
              <button id="capture-blueprint-btn">捕获当前OA页面蓝图为预设</button>
              <button id="apply-blueprint-btn">应用预设到OA页面</button>
            </div>
            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="blueprint-auto-apply-checkbox" checked>
                插件打开时自动应用蓝图预设
              </label>
            </div>
            <div class="form-group">
              <div id="blueprint-presets-list"></div>
            </div>
          </div>

          <!-- 工作场景预设卡片 -->
          <div class="config-card">
            <h3>工作场景预设</h3>
            <div class="form-group">
              <button id="capture-stagedemand-btn">捕获当前OA页面工作场景为预设</button>
              <button id="apply-stagedemand-btn">应用工作场景预设到OA页面</button>
            </div>
            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="stagedemand-auto-apply-checkbox" checked>
                插件打开时自动应用工作场景预设
              </label>
            </div>
            <div class="form-group">
              <div id="stagedemand-presets-list"></div>
            </div>
          </div>

          <!-- 任务审核人预设卡片 -->
          <div class="config-card">
            <h3>任务审核人预设</h3>
            <div class="form-group">
              <button id="capture-taskreviewer-btn">捕获当前OA页面任务审核人为预设</button>
              <button id="apply-taskreviewer-btn">应用任务审核人预设到OA页面</button>
            </div>
            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="taskreviewer-auto-apply-checkbox" checked>
                插件打开时自动应用任务审核人预设
              </label>
            </div>
            <div class="form-group">
              <div id="taskreviewer-presets-list"></div>
            </div>
          </div>

          <!-- 问题反馈卡片 -->
          <div class="config-card">
            <h3>问题反馈</h3>
            <button id="feedback-btn" class="btn-secondary">问题反馈</button>
          </div>
        </div>
      </div>
    </div>
  </div>



  <div id="toast-container" class="toast-container"></div>
  <script src="popup.js"></script>
</body>

</html>
